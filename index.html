<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAKER BARBER | صالون شاكر للحلاقة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0b0b; color: #f3f4f6; }
        .gold-bg { background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%); }
        .gold-text { background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(212, 175, 55, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="text-center my-6">
        <h1 class="text-4xl md:text-5xl font-extrabold gold-text tracking-wide mb-2">SHAKER BARBER</h1>
        <p class="text-gray-400 text-sm md:text-base">احجز موعدك بسهولة وسرعة بلمسة واحدة</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto w-full space-y-6">
        
        <div class="glass-card p-6 md:p-8 rounded-2xl shadow-2xl">
            <form id="bookingForm" onsubmit="handleBooking(event)" class="space-y-5">
                
                <!-- Client Name -->
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">الاسم الكامل</label>
                    <input type="text" id="clientName" required placeholder="أدخل اسمك الكريم"
                        class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition">
                </div>

                <!-- Client Phone -->
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">رقم الهاتف</label>
                    <input type="tel" id="clientPhone" required placeholder="05XXXXXXXX"
                        class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition text-right" dir="ltr">
                </div>

                <!-- Service Selection -->
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">اختر الخدمة</label>
                    <select id="serviceName" required
                        class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition">
                        <option value="حلاقة شعر احترافية">حلاقة شعر احترافية - 200 TL</option>
                        <option value="حلاقة شعر + ذقن">حلاقة شعر + ذقن - 300 TL</option>
                        <option value="حلاقة كاملة + تنظيف بشرة">حلاقة كاملة + تنظيف بشرة - 400 TL</option>
                    </select>
                </div>

                <!-- Date Picker -->
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">تاريخ الحجز</label>
                    <input type="date" id="bookingDate" required onchange="fetchAvailability()"
                        class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition">
                </div>

                <!-- Time Slot Grid -->
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">اختر وقت الموعد (من 18:00 إلى 23:00)</label>
                    <div id="timeSlotsGrid" class="grid grid-cols-2 md:grid-cols-3 gap-2.5">
                        <!-- slots loaded dynamically -->
                    </div>
                </div>

                <!-- Notes -->
                <div>
                    <label class="block text-sm font-semibold text-gray-300 mb-2">ملاحظات إضافية (اختياري)</label>
                    <input type="text" id="notes" placeholder="أي تفاصيل خاصة بالحجز..."
                        class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition">
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full gold-bg text-black font-bold py-4 rounded-xl shadow-lg hover:opacity-90 transition transform active:scale-95 text-base mt-4">
                    تأكيد الموعد فوراً ✂️
                </button>
            </form>
        </div>

    </main>

    <footer class="text-center text-xs text-gray-500 my-6">
        &copy; 2026 SHAKER BARBER - جميع الحقوق محفوظة
    </footer>

    <script>
        const allSlots = ["18:00", "18:45", "19:30", "20:15", "21:00", "21:45", "22:30"];
        let selectedTime = null;

        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById("bookingDate");
            dateInput.value = today;
            dateInput.min = today;
            fetchAvailability();
        });

        async function fetchAvailability() {
            const date = document.getElementById("bookingDate").value;
            const grid = document.getElementById("timeSlotsGrid");
            grid.innerHTML = "<p class='col-span-3 text-center text-gray-400 text-xs py-2'>جاري التحقق من المواعيد...</p>";
            selectedTime = null;

            if (!date) return;

            try {
                const res = await fetch(`/api/availability/${date}`);
                const data = await res.json();

                grid.innerHTML = "";

                if (data.is_blocked) {
                    grid.innerHTML = `<div class='col-span-3 bg-red-900/30 border border-red-500/50 text-red-300 p-3 rounded-xl text-center text-xs font-bold'>
                        ⚠️ هذا اليوم مغلق للحجوزات (${data.blocked_reason || 'عطلة'})
                    </div>`;
                    return;
                }

                allSlots.forEach(slot => {
                    const isBooked = data.booked_times.includes(slot);
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.disabled = isBooked;

                    if (isBooked) {
                        btn.className = "bg-zinc-900/50 text-zinc-600 border border-zinc-800 py-3 rounded-xl text-sm cursor-not-allowed line-through";
                        btn.innerText = `${slot} (محجوز)`;
                    } else {
                        btn.className = "slot-btn bg-zinc-900 border border-zinc-700 hover:border-amber-500 text-gray-200 py-3 rounded-xl text-sm transition font-semibold";
                        btn.innerText = slot;
                        btn.onclick = () => selectSlot(btn, slot);
                    }
                    grid.appendChild(btn);
                });

            } catch (err) {
                grid.innerHTML = "<p class='col-span-3 text-center text-red-400 text-xs'>حدث خطأ أثناء تحميل المواعيد</p>";
            }
        }

        function selectSlot(btnElement, slotTime) {
            document.querySelectorAll(".slot-btn").forEach(b => {
                b.classList.remove("gold-bg", "text-black", "border-amber-500", "font-bold");
                b.classList.add("bg-zinc-900", "text-gray-200");
            });

            btnElement.classList.remove("bg-zinc-900", "text-gray-200");
            btnElement.classList.add("gold-bg", "text-black", "border-amber-500", "font-bold");
            selectedTime = slotTime;
        }

        async function handleBooking(e) {
            e.preventDefault();

            if (!selectedTime) {
                alert("يرجى اختيار وقت الموعد من الجدول أولاً!");
                return;
            }

            const payload = {
                client_name: document.getElementById("clientName").value,
                client_phone: document.getElementById("clientPhone").value,
                service_name: document.getElementById("serviceName").value,
                booking_date: document.getElementById("bookingDate").value,
                booking_time: selectedTime,
                notes: document.getElementById("notes").value
            };

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerText = "جاري التأكيد...";

            try {
                const res = await fetch("/api/bookings", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (res.ok) {
                    alert("🎉 " + result.message);
                    document.getElementById("bookingForm").reset();
                    fetchAvailability();
                } else {
                    alert("❌ " + (result.detail || "تعذر الحجز!"));
                }
            } catch (err) {
                alert("❌ حدث خطأ في الاتصال بالسيرفر!");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "تأكيد الموعد فوراً ✂️";
            }
        }
    </script>
</body>
</html>
