<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHAKER BARBER | حجز المواعيد</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207' },
                        dark: { 900: '#0f0f11', 800: '#18181b', 700: '#27272a', 600: '#3f3f46' }
                    }
                }
            }
        }
    </script>
    <style>
        .gold-gradient { background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%); }
        .gold-text { background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-dark-900 text-gray-100 font-sans min-h-screen antialiased">

    <!-- Header Navigation -->
    <header class="border-b border-dark-700 bg-dark-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-10 h-10 rounded-full gold-gradient flex items-center justify-center text-black font-bold">
                    <i data-lucide="scissors" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide gold-text">SHAKER BARBER</h1>
                    <p class="text-xs text-gray-400">حلاقة احترافية وتدرجات عصرية</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

        <!-- USER BOOKING SECTION -->
        <section class="space-y-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-2 space-y-8">
                    
                    <!-- Step 1: Services -->
                    <div class="bg-dark-800 p-6 rounded-2xl border border-dark-700 space-y-4">
                        <h3 class="text-lg font-bold flex items-center gap-2 text-white">
                            <span class="w-7 h-7 rounded-full bg-gold-500/20 text-gold-400 flex items-center justify-center text-xs border border-gold-500/30">1</span>
                            <span>اختر الخدمة المطلوبة</span>
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3" id="services-grid"></div>
                    </div>

                    <!-- Step 2: Date & Time -->
                    <div class="bg-dark-800 p-6 rounded-2xl border border-dark-700 space-y-4">
                        <h3 class="text-lg font-bold flex items-center gap-2 text-white">
                            <span class="w-7 h-7 rounded-full bg-gold-500/20 text-gold-400 flex items-center justify-center text-xs border border-gold-500/30">2</span>
                            <span>حدد التاريخ والوقت (من 6 مساءً إلى 11 ليلاً)</span>
                        </h3>
                        
                        <div class="space-y-2">
                            <label class="text-xs text-gray-400">اختر اليوم:</label>
                            <div class="flex gap-2 overflow-x-auto pb-2" id="date-selector"></div>
                        </div>

                        <div class="space-y-2 pt-2">
                            <label class="text-xs text-gray-400">اختر التوقيت المتاح:</label>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="time-slots-grid"></div>
                        </div>
                    </div>

                    <!-- Step 3: Customer Info -->
                    <div class="bg-dark-800 p-6 rounded-2xl border border-dark-700 space-y-4">
                        <h3 class="text-lg font-bold flex items-center gap-2 text-white">
                            <span class="w-7 h-7 rounded-full bg-gold-500/20 text-gold-400 flex items-center justify-center text-xs border border-gold-500/30">3</span>
                            <span>معلومات الحجز والتواصل</span>
                        </h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="cust-name" placeholder="الاسم الكامل *" class="bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-gold-500">
                            <input type="tel" id="cust-phone" placeholder="رقم الهاتف (05XXXXXXXX) *" class="bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-gold-500" dir="ltr">
                        </div>
                        <textarea id="cust-notes" rows="2" placeholder="ملاحظات أو تفضيلات القصة (اختياري)..." class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-gold-500"></textarea>
                    </div>

                </div>

                <!-- Sidebar Summary -->
                <div class="lg:col-span-1">
                    <div class="bg-dark-800 p-6 rounded-2xl border border-dark-700 space-y-6 sticky top-24 shadow-xl">
                        <h3 class="text-lg font-bold border-b border-dark-700 pb-3 text-white flex items-center gap-2">
                            <i data-lucide="receipt" class="w-5 h-5 text-gold-400"></i>
                            <span>ملخص الحجز</span>
                        </h3>

                        <div class="space-y-3 text-sm">
                            <div class="flex justify-between text-gray-400">
                                <span>الخدمة:</span>
                                <span class="font-semibold text-white" id="summary-service-name">تدرج احترافي Fade</span>
                            </div>
                            <div class="flex justify-between text-gray-400">
                                <span>التاريخ والوقت:</span>
                                <span class="font-semibold text-gold-400" id="summary-dt">--</span>
                            </div>
                            <hr class="border-dark-700">
                            <div class="flex justify-between items-center text-base font-bold pt-1">
                                <span class="text-white">الإجمالي:</span>
                                <span class="text-xl gold-text" id="summary-total">350 ل.ت</span>
                            </div>
                        </div>

                        <button onclick="submitBooking()" class="w-full py-3.5 rounded-xl font-bold text-black gold-gradient hover:opacity-90 transition-all shadow-lg flex items-center justify-center gap-2">
                            <i data-lucide="check-circle" class="w-5 h-5"></i>
                            <span>تأكيد الموعد فوراً</span>
                        </button>
                    </div>
                </div>

            </div>
        </section>

        <!-- PUBLIC AVAILABILITY TABLE -->
        <section class="bg-dark-800 rounded-2xl border border-dark-700 p-6 space-y-4 shadow-xl">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-dark-700 pb-4">
                <div class="flex gap-2 overflow-x-auto" id="public-view-date-selector"></div>
                <button onclick="loadBookingsAvailability()" class="px-3 py-1.5 bg-dark-700 hover:bg-dark-600 border border-dark-600 text-gold-400 rounded-xl text-xs font-bold flex items-center gap-1.5 self-start sm:self-auto">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    <span>تحديث المواعيد</span>
                </button>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="availability-grid"></div>
        </section>

    </main>

    <script>
        const SERVICES = [
            { id: 'fade', name: 'تدرج احترافي Fade', price: 350 },
            { id: 'haircut', name: 'قص شعر عصري', price: 250 },
            { id: 'beard', name: 'تحديد وحلاقة اللحية', price: 150 }
        ];

        const TIME_SLOTS = ['06:00 م', '07:15 م', '08:30 م', '09:45 م'];

        let selectedService = SERVICES[0];
        let selectedDate = 'اليوم';
        let selectedTime = TIME_SLOTS[0];
        let publicViewDate = 'اليوم';
        let existingBookings = [];

        window.onload = async () => {
            renderServices();
            renderDates();
            renderPublicViewDates();
            await loadBookingsAvailability();
            lucide.createIcons();
        };

        async function loadBookingsAvailability() {
            try {
                const res = await fetch('/api/bookings');
                existingBookings = await res.json();
            } catch (err) {
                existingBookings = [];
            }
            renderTimes();
            renderAvailabilityGrid();
            updateSummary();
        }

        function renderServices
