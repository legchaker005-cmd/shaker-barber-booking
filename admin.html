<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية | SHAKER BARBER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207' },
                        dark: { 900: '#0f0f11', 800: '#18181b', 700: '#27272a', 600: '#3f3f46' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-gray-100 font-sans min-h-screen antialiased">

    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-dark-800 p-8 rounded-2xl border border-dark-700 max-w-sm w-full space-y-6 text-center shadow-2xl">
            <div class="w-12 h-12 bg-gold-500/10 text-gold-400 rounded-full flex items-center justify-center mx-auto border border-gold-500/20">
                <i data-lucide="lock" class="w-6 h-6"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-white">لوحة تحكم الحلاق شاكر</h2>
                <p class="text-xs text-gray-400 mt-1">أدخل الرمز السري للدخول للإدارة</p>
            </div>
            <input type="password" id="pin-input" placeholder="****" class="w-full bg-dark-900 border border-dark-700 rounded-xl px-4 py-3 text-center text-xl text-white tracking-widest focus:outline-none focus:border-gold-500">
            <button onclick="checkPin()" class="w-full py-3 bg-gold-500 text-black font-bold rounded-xl hover:bg-gold-600 transition-colors">دخول</button>
            <p id="pin-error" class="text-xs text-red-400 hidden">الرمز السري غير صحيح!</p>
        </div>
    </div>

    <!-- Admin Dashboard Screen -->
    <div id="admin-screen" class="hidden max-w-6xl mx-auto px-4 py-8 space-y-6">
        <div class="flex justify-between items-center border-b border-dark-700 pb-4">
            <div>
                <h2 class="text-xl font-bold text-white">جدول إدارة الحجوزات والزبائن</h2>
                <p class="text-xs text-gray-400">إلغاء وحذف وتعديل المواعيد</p>
            </div>
            <div class="flex gap-2">
                <button onclick="fetchBookings()" class="px-4 py-2 bg-dark-800 hover:bg-dark-700 border border-dark-700 text-gold-400 rounded-xl text-xs font-bold flex items-center gap-1.5">
                    <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    <span>تحديث</span>
                </button>
                <a href="/" class="px-4 py-2 bg-gold-500 text-black font-bold rounded-xl text-xs">عرض موقع الحجز</a>
            </div>
        </div>

        <div class="bg-dark-800 rounded-2xl border border-dark-700 overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="text-xs text-gray-400 bg-dark-900 border-b border-dark-700">
                        <tr>
                            <th class="p-3">#</th>
                            <th class="p-3">الزبون</th>
                            <th class="p-3">الهاتف</th>
                            <th class="p-3">الخدمة</th>
                            <th class="p-3">الموعد</th>
                            <th class="p-3">ملاحظات</th>
                            <th class="p-3 text-center">إجراءات الحلاق</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y divide-dark-700">
                        <tr><td colspan="7" class="text-center p-6 text-gray-500">جاري تحميل الحجوزات...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const PIN = "1234"; // 🔑 الرمز السري الخاص بك للوحة الأدمن

        window.onload = () => { lucide.createIcons(); };

        function checkPin() {
            const input = document.getElementById('pin-input').value;
            if (input === PIN) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-screen').classList.remove('hidden');
                fetchBookings();
            } else {
                document.getElementById('pin-error').classList.remove('hidden');
            }
        }

        async function fetchBookings() {
            const tbody = document.getElementById('admin-table-body');
            try {
                const res = await fetch('/api/bookings');
                const data = await res.json();

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-gray-500">لا توجد حجوزات مسجلة حالياً</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map(b => `
                    <tr class="hover:bg-dark-900/50 transition-colors">
                        <td class="p-3 text-xs text-gray-400">#${b.id}</td>
                        <td class="p-3 font-semibold text-white">${b.client_name}</td>
                        <td class="p-3 text-xs text-gold-400 font-mono" dir="ltr"><a href="tel:${b.client_phone}">${b.client_phone}</a></td>
                        <td class="p-3 text-xs text-gray-300">${b.service_name}</td>
                        <td class="p-3 text-xs text-gold-400 font-semibold">${b.booking_date} • ${b.booking_time}</td>
                        <td class="p-3 text-xs text-gray-400">${b.notes || '--'}</td>
                        <td class="p-3 text-center">
                            <button onclick="cancelBooking(${b.id})" class="px-3 py-1 bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white rounded-lg text-xs font-bold transition-colors">
                                🗑 إلغاء الحجز
                            </button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-red-400">خطأ أثناء التحميل</td></tr>`;
            }
        }

        async function cancelBooking(id) {
            if (confirm("هل أنت تأكد من إلغاء وحذف هذا الحجز؟")) {
                await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
                fetchBookings();
            }
        }
    </script>
</body>
</html>
