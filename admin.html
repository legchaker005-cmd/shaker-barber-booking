<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - حلاقة شاكر</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #d4af37;
            --text-color: #f0f0f0;
            --danger: #e74c3c;
            --success: #2ecc71;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { text-align: center; color: var(--accent-color); }
        .login-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            max-width: 350px;
            margin: 50px auto;
            text-align: center;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            text-align: center;
            font-size: 18px;
        }
        button {
            padding: 10px 20px;
            background: var(--accent-color);
            color: #121212;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #333;
        }
        th { background: #2a2a2a; color: var(--accent-color); }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .bg-confirmed { background: #f39c12; color: #000; }
        .bg-completed { background: var(--success); color: #fff; }
        .bg-canceled { background: var(--danger); color: #fff; }
        .action-btn {
            padding: 5px 10px;
            font-size: 12px;
            margin-left: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .btn-done { background: var(--success); color: white; }
        .btn-delete { background: var(--danger); color: white; }
    </style>
</head>
<body>

<div class="container">
    <!-- صفحة تسجيل الدخول -->
    <div id="loginView" class="login-box">
        <h2>🔒 لوحة التحكم</h2>
        <p>أدخل رمز الدخول السري:</p>
        <input type="password" id="pinInput" placeholder="****">
        <br>
        <button onclick="login()">دخول</button>
        <p id="loginErr" style="color:red;"></p>
    </div>

    <!-- صفحة إحصائيات وجدول الحجوزات -->
    <div id="dashboardView" style="display: none;">
        <h1>✂️ قائمة حجوزات شاكر</h1>
        <button onclick="loadBookings()" style="float: left;">🔄 تحديث البيانات</button>
        <div style="clear: both;"></div>

        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>الزبون</th>
                    <th>الهاتف</th>
                    <th>الخدمة</th>
                    <th>التاريخ والوقت</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="bookingsTable">
                <tr><td colspan="7" style="text-align:center;">جاري تحميل الحجوزات...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const ADMIN_PIN = "1234"; // 🔑 يمكنك تغيير الرقم السري هنا

    function login() {
        const pin = document.getElementById('pinInput').value;
        if (pin === ADMIN_PIN) {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            loadBookings();
        } else {
            document.getElementById('loginErr').innerText = "الرمز السري غير صحيح!";
        }
    }

    async function loadBookings() {
        try {
            const res = await fetch('/api/bookings');
            const data = await res.json();
            const tbody = document.getElementById('bookingsTable');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">لا توجد حجوزات حتى الآن.</td></tr>';
                return;
            }

            data.forEach(b => {
                let badgeClass = 'bg-confirmed';
                if (b.status === 'مكتمل') badgeClass = 'bg-completed';
                if (b.status === 'ملغي') badgeClass = 'bg-canceled';

                tbody.innerHTML += `
                    <tr>
                        <td>${b.id}</td>
                        <td><b>${b.client_name}</b></td>
                        <td><a href="tel:${b.client_phone}" style="color:#d4af37;">${b.client_phone}</a></td>
                        <td>${b.service_name}</td>
                        <td>${b.booking_date} | ${b.booking_time}</td>
                        <td><span class="badge ${badgeClass}">${b.status}</span></td>
                        <td>
                            <button class="action-btn btn-done" onclick="updateStatus(${b.id}, 'مكتمل')">✓ إكمال</button>
                            <button class="action-btn btn-delete" onclick="deleteBooking(${b.id})">🗑 حذف</button>
                        </td>
                    </tr>
                `;
            });
        } catch (e) {
            alert("حدث خطأ أثناء تحميل الحجوزات!");
        }
    }

    async function updateStatus(id, newStatus) {
        await fetch(`/api/bookings/${id}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status: newStatus})
        });
        loadBookings();
    }

    async function deleteBooking(id) {
        if (confirm("هل أنت تأكد من حذف هذا الحجز؟")) {
            await fetch(`/api/bookings/${id}`, { method: 'DELETE' });
            loadBookings();
        }
    }
</script>

</body>
</html>
